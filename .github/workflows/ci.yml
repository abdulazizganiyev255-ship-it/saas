name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (typecheck, build, rules tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, build, design-token/banned-pattern scan
        run: bun run check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules tests (emulator)
        run: bun run test

  functions:
    name: Cloud Functions (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
